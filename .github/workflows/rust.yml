name: Rust

# Temporary admission diagnostic. Do not merge.
on:
  pull_request:
    branches: [dev]
    types: [opened]

permissions:
  contents: read

concurrency:
  group: sdk-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission-canary:
    name: SDK Namespace admission diagnostic
    runs-on: namespace-profile-sov-ubuntu-24-04-amd64-16x32-dev-250gb-1-88
    timeout-minutes: 2
    steps:
      - name: Emit bounded admission marker
        shell: bash
        run: |
          printf 'sdk-ci-admission:0daff2b9864c62cb519455196cafd6b3 uid=%s\n' "$(id -u)"
          printf 'repository=%s event=%s run=%s attempt=%s sha=%s ref=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF"
